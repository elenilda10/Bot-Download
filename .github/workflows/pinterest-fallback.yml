name: Pinterest fallback tests

on:
  pull_request:
    paths:
      - "services/platforms/pinterest_media.py"
      - "handlers/pinterest.py"
      - "services/media/video_metadata.py"
      - "services/inline/send_flow.py"
      - "tests/test_pinterest_telegram_video_send.py"
      - "tests/test_video_metadata.py"
      - "tests/test_pinterest_vps_patcher.py"
      - "scripts/apply_pinterest_video_send.py"
      - "tests/test_pinterest_gallery_fallback.py"
      - "scripts/inspect_pinterest_json_fields.py"
      - "scripts/apply_pinterest_real_json.py"
      - "tests/test_pinterest_caption_delivery.py"
      - "scripts/apply_pinterest_captions.py"
      - "scripts/apply_pinterest_caption_records.py"
      - "scripts/apply_pinterest_local_first.py"
      - "tests/test_pinterest_ytdlp_fallback.py"
      - ".github/workflows/pinterest-fallback.yml"
  push:
    branches: [main]
    paths:
      - "services/platforms/pinterest_media.py"
      - "handlers/pinterest.py"
      - "services/media/video_metadata.py"
      - "services/inline/send_flow.py"
      - "tests/test_pinterest_telegram_video_send.py"
      - "tests/test_video_metadata.py"
      - "tests/test_pinterest_vps_patcher.py"
      - "scripts/apply_pinterest_video_send.py"
      - "tests/test_pinterest_gallery_fallback.py"
      - "scripts/inspect_pinterest_json_fields.py"
      - "scripts/apply_pinterest_real_json.py"
      - "tests/test_pinterest_caption_delivery.py"
      - "scripts/apply_pinterest_captions.py"
      - "scripts/apply_pinterest_caption_records.py"
      - "scripts/apply_pinterest_local_first.py"
      - "tests/test_pinterest_ytdlp_fallback.py"
      - ".github/workflows/pinterest-fallback.yml"

permissions:
  contents: read

jobs:
  pinterest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BOT_TOKEN: "123456:TESTTOKEN"
      ADMIN_ID: "1"
      CUSTOM_API_URL: "https://api.example.com"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/pinterest_test"
      CHANNEL_ID: "-1001234567890"
      PYTHONPATH: ${{ github.workspace }}
      LOG_DISABLE_SINKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bot dependencies excluding optional Shazam and gallery-dl
        run: |
          sed -e '/^shazamio$/d' -e '/^gallery-dl$/d' requirements.txt > /tmp/requirements-pinterest.txt
          python -m pip install --disable-pip-version-check \
            -r /tmp/requirements-pinterest.txt pytest pytest-asyncio
      - name: Check source compilation
        run: |
          python -m py_compile services/platforms/pinterest_media.py tests/test_pinterest_gallery_fallback.py tests/test_pinterest_ytdlp_fallback.py scripts/apply_pinterest_local_first.py tests/test_pinterest_caption_delivery.py scripts/apply_pinterest_captions.py scripts/apply_pinterest_caption_records.py scripts/inspect_pinterest_json_fields.py scripts/apply_pinterest_real_json.py handlers/pinterest.py services/inline/send_flow.py services/media/video_metadata.py tests/test_pinterest_telegram_video_send.py tests/test_video_metadata.py scripts/apply_pinterest_video_send.py tests/test_pinterest_vps_patcher.py
      - name: Run Pinterest fallback tests
        run: |
          pytest -q tests/test_pinterest_gallery_fallback.py tests/test_pinterest_ytdlp_fallback.py tests/test_pinterest_caption_delivery.py tests/test_pinterest_telegram_video_send.py tests/test_video_metadata.py tests/test_pinterest_vps_patcher.py
