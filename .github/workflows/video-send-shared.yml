name: Shared video-send regression

on:
  pull_request:
    paths:
      - "handlers/threads.py"
      - "services/media/delivery.py"
      - "tests/test_video_send_shared_regression.py"
      - ".github/workflows/video-send-shared.yml"
  push:
    branches: [main]
    paths:
      - "handlers/threads.py"
      - "services/media/delivery.py"
      - "tests/test_video_send_shared_regression.py"
      - ".github/workflows/video-send-shared.yml"

permissions:
  contents: read

jobs:
  shared-video:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      BOT_TOKEN: "123456:TESTTOKEN"
      ADMIN_ID: "1"
      CUSTOM_API_URL: "https://api.example.com"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/video_shared_test"
      CHANNEL_ID: "-1001234567890"
      PYTHONPATH: ${{ github.workspace }}
      LOG_DISABLE_SINKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot dependencies without optional Shazam and gallery-dl
        run: |
          sed -e '/^shazamio$/d' -e '/^gallery-dl$/d' requirements.txt > /tmp/requirements-video-shared.txt
          python -m pip install --disable-pip-version-check \
            -r /tmp/requirements-video-shared.txt pytest pytest-asyncio
      - name: Validate Python source
        run: |
          python -m py_compile handlers/threads.py services/media/delivery.py tests/test_video_send_shared_regression.py
      - name: Run video send regression
        run: |
          pytest -q tests/test_video_send_shared_regression.py
